# Hyprland >= 0.53 window / layer rules
windowrule = match:class ^(pavucontrol|org.pulseaudio.pavucontrol)$, float on, center on
windowrule = match:class ^(blueman-manager)$, float on, center on
windowrule = match:class ^(nm-connection-editor)$, float on, center on
windowrule = match:class ^(wlogout)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on

windowrule = match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$, tag +browser
windowrule = match:class ^(chrome-.+-Default)$, tag +browser
windowrule = match:class ^(cursor)$, tag +editor
windowrule = match:class ^(Cursor)$, tag +editor

layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha 0, match:namespace waybar
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = blur on, match:namespace swaync
layerrule = blur on, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0, match:namespace swaync-notification-window
