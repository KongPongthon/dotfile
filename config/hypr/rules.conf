# Hyprland >= 0.53 window rules
windowrule = match:class ^(pavucontrol)$, float
windowrule = match:class ^(blueman-manager)$, float
windowrule = match:class ^(nm-connection-editor)$, float
windowrule = match:class ^(wlogout)$, float
windowrule = match:title ^(Picture-in-Picture)$, float

windowrule = match:class ^([Gg]oogle-chrome(-beta|-dev|-unstable)?)$, tag +browser
windowrule = match:class ^(chrome-.+-Default)$, tag +browser
windowrule = match:class ^(cursor)$, tag +editor
windowrule = match:class ^(Cursor)$, tag +editor
