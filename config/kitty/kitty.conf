font_family JetBrainsMono Nerd Font
font_size 14.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.92
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 8000
wheel_scroll_multiplier 3.0

cursor_shape beam
cursor_blink yes

# Catppuccin-ish
foreground #cdd6f4
background #1e1e2e
selection_foreground #1e1e2e
selection_background #89b4fa

color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #cba6f7
color6 #94e2d5
color7 #bac2de
color8 #585b70
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #a6adc8

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
