# Session lock — wallpaper + centered user / password (Rumda palette)
# lock.bg is a symlink updated by set-wallpaper.sh / install.sh

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = false
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/.config/hypr/lock.bg
    color = rgba(1c1612ee)
    blur_passes = 2
    blur_size = 4
    brightness = 0.75
    contrast = 1.05
}

label {
    monitor =
    text = $USER
    color = rgba(e9f3fbff)
    font_size = 28
    font_family = JetBrainsMono Nerd Font
    position = 0, 48
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(9890d0ff)
    font_size = 56
    font_family = JetBrainsMono Nerd Font
    position = 0, 140
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    rounding = 10
    outer_color = rgba(817bbeff)
    inner_color = rgba(1c1612ee)
    font_color = rgba(e9f3fbff)
    fade_on_empty = false
    placeholder_text = <i>Password</i>
    fail_text = <i>$PAMFAIL</i>
    position = 0, -40
    halign = center
    valign = center
}
